[package]
name = "prospective-scan-clients"
version = "0.0.0"
edition = "2024"
publish = false

# Clients scanned with the target checklist, survivor observations and
# allowed-set verdicts (see ../RESCAN.md, section 6).
[features]
# New-dimension experiments (schedulable gap, residual bytes). Off for the
# regular scan so its results stay comparable.
net = ["dropwise/net", "tokio/io-util"]

[dependencies]
dropwise = { path = "../.." }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "pool", "smtp-transport", "tokio1"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "mysql"] }
tokio = { version = "1.40", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
