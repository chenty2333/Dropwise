[package]
name = "prospective-t3-sqlx"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
dropwise = { path = "../.." }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.40", features = ["macros", "rt", "time", "test-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
