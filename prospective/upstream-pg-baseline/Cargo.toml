[package]
name = "pg-upstream-proof"
version = "0.1.0"
edition = "2021"
publish = false
description = "Upstream tokio-postgres + bb8 baseline under byte-level reply cuts (research probe)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-postgres = "=0.7.18"
bb8 = "=0.9.1"
bb8-postgres = "=0.9.0"
