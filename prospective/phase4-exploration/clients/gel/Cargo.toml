[package]
name = "p4e-gel"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
dropwise = { path = "../../../..", features = ["net"] }
gel-tokio = { version = "=0.11.0" }
tokio = { version = "1.40", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
