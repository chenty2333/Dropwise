[package]
name = "p4e-pop"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "pop-ladder"
path = "src/main.rs"

[dependencies]
dropwise = { path = "../../../..", features = ["net"] }
async-pop = { version = "=1.1.3", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.40", features = ["macros", "net", "rt", "rt-multi-thread", "time", "io-util"] }
