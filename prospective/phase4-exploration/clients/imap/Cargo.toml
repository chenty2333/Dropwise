[package]
name = "p4-imap-explore"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "imap-explore"
path = "src/main.rs"

[dependencies]
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
dropwise = { path = "../../../..", features = ["net"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
