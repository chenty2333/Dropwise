[package]
name = "prospective-t2-bb8-managers"
version = "0.0.0"
edition = "2024"
publish = false

# Published bb8 managers against real servers, and deadpool for comparison
# (see ../RESCAN.md, sections 4 and 5).
[dependencies]
dropwise = { path = "../.." }
bb8 = "=0.9.1"
bb8-redis = "=0.26.0"
bb8-postgres = "=0.9.0"
bb8-memcached = "=0.7.0"
deadpool = { version = "=0.13.1", features = ["rt_tokio_1"] }
deadpool-memcached = "=0.5.0"
async-memcached = { version = "=0.7.0", default-features = false }
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
tokio-postgres = "0.7"
tokio = { version = "1.40", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
