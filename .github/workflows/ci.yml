name: Core CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the declared minimum Rust version
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test all features on the minimum version
        run: timeout 180s cargo +1.88.0 test --locked --all-features

  python-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Test the Python engine without external services
        env:
          PYTHONPATH: research/python-retro
        run: timeout 60s python -m unittest discover -s research/python-retro/tests -v

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Check root crate formatting
        # Only the root package: `prospective/`, `repro/` and `research/` are
        # separate crates with their own style and are not part of Core CI.
        run: cargo +stable fmt --check --package dropwise
      - name: Test core library and doctests
        run: timeout 180s cargo +stable test --locked
      - name: Lint all core targets
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked --no-deps
      - name: Run quickstart
        run: timeout 60s cargo +stable run --locked --example quickstart
      - name: Run direct, pooled and limits examples
        run: |
          for example in direct_handle pooled_handoff limits; do
            timeout 60s cargo +stable run --locked --example "$example"
          done
      - name: Test and lint the optional network feature
        run: |
          timeout 180s cargo +stable test --locked --features net
          cargo +stable clippy --locked --all-targets --features net -- -D warnings
